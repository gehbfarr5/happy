name: build-android-apk

on:
  push:
    branches:
      - codex/build-android-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      APP_ENV: production
      EXPO_NO_TELEMETRY: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - name: Generate Android project
        working-directory: packages/happy-app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Tune Gradle for CI
        working-directory: packages/happy-app/android
        run: |
          set -euo pipefail
          perl -0pi -e 's/^org\.gradle\.jvmargs=.*$/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g/m' gradle.properties
          if grep -q '^org\.gradle\.workers\.max=' gradle.properties; then
            perl -0pi -e 's/^org\.gradle\.workers\.max=.*$/org.gradle.workers.max=2/m' gradle.properties
          else
            printf '\norg.gradle.workers.max=2\n' >> gradle.properties
          fi

      - name: Build debug APK
        working-directory: packages/happy-app/android
        run: ./gradlew --no-daemon --no-parallel --stacktrace assembleDebug

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -e "const fs=require('fs'); const src=fs.readFileSync('./packages/happy-app/app.config.js','utf8'); const match=src.match(/version:\\s*\\\"([^\\\"]+)\\\"/); if (!match) { throw new Error('version not found in app.config.js'); } console.log(match[1]);")"
          APK_PATH="$(find packages/happy-app/android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found under packages/happy-app/android/app/build/outputs/apk/debug"
            exit 1
          fi
          mkdir -p dist
          cp "${APK_PATH}" "dist/happy-android-v${VERSION}-debug.apk"
          {
            echo "version=${VERSION}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_sha=${GITHUB_SHA}"
            echo "source_apk=${APK_PATH}"
          } > dist/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-android-apk
          path: dist/*
          if-no-files-found: error
