name: build-android-apk

on:
  push:
    branches:
      - codex/build-android-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      APP_ENV: production
      EXPO_NO_TELEMETRY: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - name: Generate Android project
        working-directory: packages/happy-app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        working-directory: packages/happy-app/android
        run: ./gradlew --no-daemon --no-parallel assembleDebug

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --input-type=module -e "import config from './packages/happy-app/app.config.js'; console.log(config.expo.version)")"
          mkdir -p dist
          cp packages/happy-app/android/app/build/outputs/apk/debug/app-debug.apk "dist/happy-android-v${VERSION}-debug.apk"
          {
            echo "version=${VERSION}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_sha=${GITHUB_SHA}"
          } > dist/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-android-apk
          path: dist/*
          if-no-files-found: error
